name: Firmware

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: firmware-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: platformio.ini

      - name: Install build tools
        run: python -m pip install platformio==6.1.19 clang-format==18.1.8

      - name: Cache PlatformIO packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.platformio
          key: platformio-${{ runner.os }}-${{ hashFiles('platformio.ini', 'firmware/lib/**/library.json') }}
          restore-keys: platformio-${{ runner.os }}-

      - name: Check authoritative version
        run: python scripts/check_version.py

      - name: Check C++ formatting
        run: >-
          find firmware -type f \( -name '*.cpp' -o -name '*.h' \) -print0 |
          xargs -0 clang-format --dry-run --Werror

      - name: Build ESP32-D0WD-V3 firmware
        run: pio run -e esp32-d0wd-v3

      - name: Run hardware-independent firmware tests
        run: pio test -e native
