[platformio]
default_envs = esp32-d0wd-v3
src_dir = firmware/src
include_dir = firmware/include
test_dir = firmware/test
data_dir = firmware/data
lib_dir = firmware/lib

[env]
platform = espressif32@6.10.0
framework = arduino
monitor_speed = 115200
extra_scripts = pre:scripts/platformio_version.py
build_flags =
    -Wall
    -Wextra
    -Werror=return-type
    -std=gnu++17
build_unflags =
    -std=gnu++11

[env:esp32-d0wd-v3]
; PlatformIO's esp32dev board definition targets the ESP32-D0WD-V3 module.
board = esp32dev
board_build.filesystem = littlefs
; DeskWave is updated over USB and does not implement OTA. The standard no-OTA
; layout provides a 2 MiB application partition for the complete Japanese font
; while retaining a 1.875 MiB LittleFS artwork cache.
board_build.partitions = no_ota.csv
upload_speed = 115200
build_flags =
    ${env.build_flags}
    -DDESKWAVE_ESP32_D0WD_V3=1
lib_deps =
    bblanchon/ArduinoJson@7.4.3
    links2004/WebSockets@2.7.3
    lovyan03/LovyanGFX@1.2.27

[env:native]
platform = native@1.2.1
framework =
test_framework = unity
test_build_src = false
build_flags =
    -std=gnu++17
    -Wall
    -Wextra
    -Werror
